name: Sync to Hugging Face
on:
  push:
    branches: [main]

jobs:
  test:
    name: Build & Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Backend Tests (Spring Boot & DDL Validate)
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw test -Dspring.profiles.active=ci

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm ci
          npm run build

  deploy:
    name: Deploy to Hugging Face
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean up unwanted files before push
        run: |
          # 로그, DB, 업로드 폴더 등 바이너리 파일 강제 삭제
          rm -rf backend/data/*.db
          rm -rf backend/uploads/*
          rm -rf backend/*.log
          rm -rf backend/*.txt
          find . -name "*.xlsx" -type f -delete
          find . -name "*.pdf" -type f -delete

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 원격 저장소를 강제로 덮어씌워 과거의 바이너리 기록을 제거합니다.
          git push --force https://yjh332123:$HF_TOKEN@huggingface.co/spaces/yjh332123/qms main

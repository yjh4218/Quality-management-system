# H2 Console for Local Development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Session Management for Local (H2)
spring.session.jdbc.initialize-schema=always
spring.session.timeout=32400s

# Disable Flyway for local to avoid migration script conflicts with H2
spring.flyway.enabled=false

# [LOCAL FIX] SameSite=Lax (Cross-port localhost request allowed)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# [성능/보안] OSIV 비활성화 (운영 환경 정합성 확보)
spring.jpa.open-in-view=false

# [SYNC] Supabase Connection for Sync-Down (환경 변수화 적용)
supabase.datasource.url=${SUPABASE_SYNC_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
supabase.datasource.username=${SUPABASE_SYNC_USERNAME:postgres.ruhghbmvjkfwdjdnlhgl}
supabase.datasource.password=${SUPABASE_SYNC_PASSWORD:}

# Show SQL for debugging
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=trace
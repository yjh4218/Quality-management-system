# Force use of PostgreSQL (Supabase) via Environment Variables
server.forward-headers-strategy=framework
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Schema
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=5s

# [SECURITY PATCH] 운영 환경 세션 및 업로드 정책
server.servlet.session.cookie.name=QMS_SESSION_V2
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# [CORS/HTTPS PROXY COOKIE FIX] reverse proxy 뒤에 존재할 때 Secure 세션 쿠키 유지를 위한 WAS 설정
server.use-forward-headers=true

# CORS 운영 환경 명시적 허용 목록
cors.allowed-origins=https://qualitymange.pages.dev,https://*.pages.dev,https://*.hf.space

# HikariCP fine-tuning for Supabase (more resilient to network lag)
spring.datasource.hikari.pool-name=QMS-HikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1

# [Optimization] Prevent startup blocking by DB connection
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.default_batch_fetch_size=1000

# [Optimization] Open-In-View disabled to reduce overhead
spring.jpa.open-in-view=false

# Spring Boot Actuator Configuration (Health Check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Cache Config (60 seconds)
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=60s

# [운영] 스토리지 설정 (S3/Supabase 연동)
storage.type=${STORAGE_TYPE:local}
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}
storage.s3.bucket=${STORAGE_S3_BUCKET:}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
storage.s3.region=${STORAGE_S3_REGION:ap-northeast-2}

# Resend API Configuration
resend.api.key=${RESEND_API_KEY:}
resend.api.url=https://api.resend.com/emails
resend.from.address=${RESEND_FROM_ADDRESS:}
resend.from.name=QMS System

# App Global Domain Settings
app.frontend.url=${APP_FRONTEND_URL:https://qualitymange.pages.dev}
app.backend.url=${APP_BACKEND_URL:https://yjh4218-quality-management-system.hf.space}


